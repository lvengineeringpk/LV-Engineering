<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 145" width="100%" height="100%" fill="none">
  <defs>
    <style>
      .lv-title-black {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 900;
        font-size: 32px;
        fill: #111827;
        letter-spacing: 0.04em;
      }
      .lv-title-red {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 900;
        font-size: 32px;
        fill: #ad1c24;
        letter-spacing: 0.04em;
      }
      .lv-eng-blue {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 900;
        font-size: 27px;
        fill: #1e73be;
        letter-spacing: 0.125em;
      }
    </style>
  </defs>

  <!-- ==================== EMBLEM (MONOGRAM + GEAR + LIGHTNING) ==================== -->
  <g id="lv-emblem" transform="translate(6, 6)">
    <!-- 1. Blue Industrial Gear (Background of Right Arm) -->
    <g id="gear" fill="#1e73be">
      <!-- 6 Prominent Gear Teeth (Cogs) on Upper Right, Right & Lower Right -->
      <!-- Tooth 1 (~1:00) -->
      <rect x="133" y="30" width="13" height="15" rx="1.5" transform="rotate(-38 139.5 37.5)" />
      <!-- Tooth 2 (~2:00) -->
      <rect x="144" y="50" width="13" height="15" rx="1.5" transform="rotate(-14 150.5 57.5)" />
      <!-- Tooth 3 (~3:00) -->
      <rect x="144" y="71" width="13" height="15" rx="1.5" transform="rotate(10 150.5 78.5)" />
      <!-- Tooth 4 (~4:00) -->
      <rect x="135" y="91" width="13" height="15" rx="1.5" transform="rotate(34 141.5 98.5)" />
      <!-- Tooth 5 (~5:00) -->
      <rect x="117" y="106" width="13" height="15" rx="1.5" transform="rotate(58 123.5 113.5)" />
      <!-- Tooth 6 (~6:00) -->
      <rect x="94" y="113" width="13" height="15" rx="1.5" transform="rotate(82 100.5 120.5)" />

      <!-- Outer Gear Body Arc -->
      <path
        d="M 104 32
           A 39 39 0 0 1 143 71
           A 39 39 0 0 1 104 110
           L 104 95
           A 24 24 0 0 0 128 71
           A 24 24 0 0 0 104 47
           Z"
      />

      <!-- 6 Perforated White Rivet Holes along the Circular Track of the Gear -->
      <circle cx="132" cy="45" r="2.8" fill="#ffffff" />
      <circle cx="137" cy="61" r="2.8" fill="#ffffff" />
      <circle cx="135" cy="78" r="2.8" fill="#ffffff" />
      <circle cx="127" cy="93" r="2.8" fill="#ffffff" />
      <circle cx="114" cy="103" r="2.8" fill="#ffffff" />
      <circle cx="98" cy="106" r="2.8" fill="#ffffff" />
    </g>

    <!-- 2. Deep Crimson Red Letter 'L' -->
    <path
      d="M 4 12
         H 32
         V 94
         H 56
         V 122
         H 4
         Z"
      fill="#ad1c24"
    />

    <!-- 3. Deep Crimson Red Letter 'V' -->
    <!-- Left diagonal arm of V -->
    <path
      d="M 36 12
         H 64
         L 76 76
         L 66 122
         L 52 122
         Z"
      fill="#ad1c24"
    />

    <!-- Right Arm of V with Circular Medallion enclosing the Lightning Bolt -->
    <path
      d="M 66 122
         L 76 76
         C 76 50, 94 36, 114 36
         C 127 36, 135 45, 135 55
         C 135 69, 126 83, 112 91
         L 128 12
         H 104
         L 94 48
         C 86 54, 82 64, 82 74
         Z"
      fill="#ad1c24"
    />

    <!-- 4. Pure White Lightning Bolt Cutout inside Right Arm -->
    <polygon
      points="114,43 103,66 116,64 96,98 108,74 97,76"
      fill="#ffffff"
    />
  </g>

  <!-- ==================== WORDMARK (LOW VOLTAGE ENGINEERING) ==================== -->
  <g id="lv-wordmark" transform="translate(182, 14)">
    <!-- Line 1: LOW (Dark Charcoal/Black) VOLTAGE (Crimson Red) -->
    <text x="0" y="44">
      <tspan class="lv-title-black">LOW </tspan>
      <tspan class="lv-title-red">VOLTAGE</tspan>
    </text>

    <!-- Line 2: ENGINEERING (Mechanical Blue) -->
    <text x="0" y="80" class="lv-eng-blue">
      ENGINEERING
    </text>

    <!-- Line 3: Signature Red Line with Terminal Square Block -->
    <g id="terminal-bar" transform="translate(0, 93)">
      <!-- Red horizontal rule -->
      <line x1="0" y1="5" x2="278" y2="5" stroke="#ad1c24" stroke-width="3" stroke-linecap="square" />
      <!-- Solid red terminal square block at right end -->
      <rect x="275" y="0" width="10" height="10" fill="#ad1c24" rx="0.5" />
    </g>
  </g>
</svg>
