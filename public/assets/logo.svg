<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 535 140" width="100%" height="100%" fill="none">
  <defs>
    <style>
      .lv-title {
        font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
        font-weight: 900;
        font-size: 34px;
        fill: #1f2328;
        letter-spacing: 0.04em;
      }
      .lv-eng {
        font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
        font-weight: 900;
        font-size: 32px;
        fill: #275ba4;
      }
    </style>
  </defs>

  <!-- ==================== LEFT: EMBLEM MARK ==================== -->
  <g id="lv-emblem" transform="translate(4, 0)">
    <!-- Layer 1 (Back): Blue Industrial Gear (#275ba4) with 5 Concentric Teeth -->
    <g fill="#275ba4">
      <circle cx="106" cy="70" r="44" />
      <rect x="144" y="62" width="17" height="16" rx="2" transform="rotate(-32 106 70)" />
      <rect x="144" y="62" width="17" height="16" rx="2" transform="rotate(-8 106 70)" />
      <rect x="144" y="62" width="17" height="16" rx="2" transform="rotate(16 106 70)" />
      <rect x="144" y="62" width="17" height="16" rx="2" transform="rotate(40 106 70)" />
      <rect x="144" y="62" width="17" height="16" rx="2" transform="rotate(64 106 70)" />
    </g>

    <!-- Layer 2: Red Letter 'L' (#b0212b) -->
    <path
      d="M 12 16
         H 36
         V 98
         H 64
         V 124
         H 12
         Z"
      fill="#b0212b"
    />

    <!-- Layer 3: Red Letter 'V' Left Arm (#b0212b) -->
    <polygon
      points="38,16 62,16 88,124 64,124"
      fill="#b0212b"
    />

    <!-- Layer 4: Red Circular Medallion (#b0212b) -->
    <circle cx="106" cy="70" r="35" fill="#b0212b" />

    <!-- Layer 5: Red Letter 'V' Right Arm (#b0212b) -->
    <polygon
      points="64,124 88,124 140,16 116,16"
      fill="#b0212b"
    />

    <!-- Layer 6 (FRONT OF ALL LAYERS): BOLD, PROMINENT WHITE LIGHTNING BOLT (⚡) -->
    <polygon
      id="prominent-white-lightning-bolt"
      points="118,36 90,70 112,70 82,104 130,62 108,62"
      fill="#ffffff"
      stroke="#ffffff"
      stroke-width="1.2"
      stroke-linejoin="miter"
    />
  </g>

  <!-- ==================== RIGHT: WORDMARK LOCKUP ==================== -->
  <g id="lv-wordmark" transform="translate(178, 16)">
    <!-- Line 1: LOW VOLTAGE - All Dark Charcoal / Black (#1f2328) -->
    <text
      x="0"
      y="38"
      class="lv-title"
    >
      LOW VOLTAGE
    </text>

    <!-- Line 2: ENGINEERING - Royal Blue (#275ba4) -->
    <text
      x="0"
      y="76"
      textLength="330"
      lengthAdjust="spacing"
      class="lv-eng"
    >
      ENGINEERING
    </text>

    <!-- Line 3: Signature Red Rule with Terminal Square Box (#b0212b) -->
    <g id="terminal-bar" transform="translate(0, 91)">
      <!-- Red horizontal rule -->
      <line x1="0" y1="6" x2="314" y2="6" stroke="#b0212b" stroke-width="4.5" stroke-linecap="round" />
      <!-- Solid red terminal square block at right end -->
      <rect x="314" y="-1.5" width="16" height="16" fill="#b0212b" rx="2" />
    </g>
  </g>
</svg>
